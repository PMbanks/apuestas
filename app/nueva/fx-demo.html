<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fx demo</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="fx.css">
<style>
  :root{--bg:#1d2129;--ink:#f4f2ec;--soft:#dcd9d2;--mute:#99a0aa;--acc:#f2c14e;--win:#2bd47d}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,sans-serif;padding:20px 16px 60px;max-width:900px;margin-inline:auto}
  h1{font-size:22px;margin:0 0 4px} p{color:var(--mute);margin:0 0 18px}
  .fila{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px;align-items:center}
  button.b{background:#272c36;color:var(--ink);border:0;border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer;min-height:40px}
  button.b:hover{background:#323846}
  #caja{height:120px;border-radius:14px;background:#272c36;display:flex;align-items:center;justify-content:center;font-size:20px;margin:0 0 18px}
  #rueda{width:110px;height:110px;border-radius:50%;background:conic-gradient(#e0574f,#222,#e0574f,#222,#e0574f,#222,#2bd47d);margin:0 0 18px}
  h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 8px}
</style>
</head>
<body>
<h1>fx demo</h1>
<p>Pagina de pruebas de fx.js (no enlazada desde la app).</p>

<h2>Sonido (boton compartido)</h2>
<div class="fila" id="bt"></div>

<h2>Sonidos</h2>
<div class="fila" id="sonidos"></div>

<h2>Efectos</h2>
<div id="caja">Caja de prueba</div>
<div class="fila">
  <button class="b" id="g1">gana en la caja</button>
  <button class="b" id="g2">gana en pantalla</button>
  <button class="b" id="p1">pierde en la caja</button>
  <button class="b" id="p2">pierde en pantalla</button>
  <button class="b" id="gi">giro on/off</button>
</div>
<div id="rueda"></div>

<script type="module">
import { sonido, gana, pierde, giro, boton } from './fx.js';
boton(document.getElementById('bt'));
const nombres = ['tick','bola','giro','galope','publico','campana','casilla','gema','explosion','gana','pierde'];
const cont = document.getElementById('sonidos');
let parar = null;
for (const n of nombres) {
  const b = document.createElement('button'); b.className = 'b'; b.textContent = n;
  b.onclick = () => {
    if (n === 'galope') {
      if (parar) { parar(); parar = null; b.textContent = 'galope'; }
      else { parar = sonido('galope'); b.textContent = 'galope (parar)'; }
    } else sonido(n);
  };
  cont.appendChild(b);
}
const caja = document.getElementById('caja'), rueda = document.getElementById('rueda');
document.getElementById('g1').onclick = () => gana(12500, { el: caja });
document.getElementById('g2').onclick = () => gana(300);
document.getElementById('p1').onclick = () => pierde(2000, { el: caja });
document.getElementById('p2').onclick = () => pierde(50);
let on = false;
document.getElementById('gi').onclick = () => { on = !on; giro(rueda, on); if (on) sonido('giro'); };
</script>
</body>
</html>
